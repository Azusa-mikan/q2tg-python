[project]
name = "q2tg-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 项目使用 Python 3.13 的类型语法和 asyncio 行为。
requires-python = ">=3.13"
dependencies = [
    # 视频兼容转码还要求系统提供 ffmpeg 和 ffprobe 可执行文件。
    # SQLite 异步驱动。
    "aiosqlite==0.22.1",
    # MySQL/MariaDB 异步驱动。
    "asyncmy==0.2.11",
    # PostgreSQL 异步驱动。
    "asyncpg==0.31.0",
    # SQLite schema 的版本化迁移。
    "alembic==1.18.5",
    # 通过文件签名识别常见媒体格式。
    "filetype==1.2.0",
    # HTTP、临时媒体下载端点和 OneBot 反向 WebSocket。
    "fastapi==0.140.1",
    # 将内存大小缩放为易读单位。
    "humanize==4.16.0",
    # 两个平台图片和视频的流式下载客户端。
    "httpx[socks]==0.28.1",
    # 将 Telegram 静态 WebP 贴纸转换为透明 PNG。
    "pillow==12.3.0",
    # 解码 QQ/微信使用的腾讯 SILK v3 语音。
    "pilk==0.2.4",
    # 获取当前进程的常驻内存大小。
    "psutil==7.2.2",
    # .env 应用配置的字段类型校验与加载。
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    # Telegram Bot API、long polling 和消息 handlers。
    "python-telegram-bot==22.8",
    # 多数据库异步数据访问和跨方言 schema。
    "sqlalchemy==2.0.51",
    # FastAPI 的 ASGI 服务器，由 main.py 启动。
    "uvicorn==0.52.0",
    # Uvicorn 的 WebSocket 协议实现依赖。
    "websockets==17.0",
]

[dependency-groups]
dev = [
    # Python 静态类型检查。
    "pyright>=1.1.411",
    # Python lint 与代码规范检查。
    "ruff>=0.16.1",
]
