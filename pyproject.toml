[project]
name = "q2tg-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 项目使用 Python 3.13 的类型语法和 asyncio 行为。
requires-python = ">=3.13"
dependencies = [
    # 视频兼容转码还要求系统提供 ffmpeg 和 ffprobe 可执行文件。
    # 群绑定和 30 天消息映射的异步 SQLite 持久化。
    "aiosqlite>=0.22.1",
    # HTTP、临时媒体下载端点和 OneBot 反向 WebSocket。
    "fastapi>=0.140.1",
    # 两个平台图片和视频的流式下载客户端。
    "httpx[socks]>=0.28.1",
    # 将 Telegram 静态 WebP 贴纸和 TGS 缩略图转换为透明 PNG。
    "pillow>=12.3.0",
    # .env 应用配置的字段类型校验与加载。
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Telegram Bot API、long polling 和消息 handlers。
    "python-telegram-bot>=22.8",
    # FastAPI 的 ASGI 服务器，由 main.py 启动。
    "uvicorn>=0.41.0",
    # Uvicorn 的 WebSocket 协议实现依赖。
    "websockets>=17.0",
]
